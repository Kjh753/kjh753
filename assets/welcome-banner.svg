<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Welcome — To my GitHub profile"><style>
@keyframes gradient-left{0%,100%{stop-color:#243B64}33.333%{stop-color:#563B75}66.667%{stop-color:#205457}}
@keyframes gradient-right{0%,100%{stop-color:#654478}33.333%{stop-color:#206067}66.667%{stop-color:#345481}}
.gradient-left{animation:gradient-left 180s ease-in-out infinite}.gradient-right{animation:gradient-right 180s ease-in-out infinite}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{transform:translateX(-35px);opacity:.65}50%{transform:translateX(35px);opacity:1}}
@keyframes line{from{stroke-dashoffset:240;opacity:0}to{stroke-dashoffset:0;opacity:.65}}
.welcome-title{animation:arrive .8s ease-out both}
.welcome-subtitle{animation:arrive .8s .9s ease-out both}
ellipse{animation:glow 8s ease-in-out infinite}
ellipse:nth-of-type(2){animation-delay:-4s}
path{stroke-dasharray:240;animation:line 1.3s .55s ease-out both}
@keyframes wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(18deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(16deg)}80%{transform:rotate(-5deg)}}
.hand-enter{animation:arrive .8s 1.8s ease-out both}
text.wave{transform-box:fill-box;transform-origin:60% 85%;animation:wave 1.2s 2.6s 2 ease-in-out both}
@media(prefers-reduced-motion:reduce){text,ellipse,path,.hand-enter,.banner-bg,.gradient-left,.gradient-right{animation:none!important}}
</style><defs><linearGradient id="background-gradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop class="gradient-left" stop-color="#243B64"/><stop class="gradient-right" offset="100%" stop-color="#654478"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5D8CFF" /><stop offset="1" stop-color="#AD83F7" /></linearGradient><radialGradient id="blue"><stop stop-color="#3B6DF1" stop-opacity=".25" /><stop offset="1" stop-color="#3B6DF1" stop-opacity="0" /></radialGradient><radialGradient id="purple"><stop stop-color="#9263D9" stop-opacity=".24" /><stop offset="1" stop-color="#9263D9" stop-opacity="0" /></radialGradient><clipPath id="banner-clip"><rect width="960" height="220" rx="15" /></clipPath></defs><g clip-path="url(#banner-clip)"><rect width="960" height="220" rx="15" class="banner-bg" fill="url(#background-gradient)" /><rect x=".5" y=".5" width="959" height="219" rx="15" fill="none" stroke="#2C374E" /><path d="M370 175H590" stroke="url(#accent)" stroke-width="1.5" opacity=".65" /><g transform="translate(0 22)" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text class="welcome-title" x="450" y="94" fill="#F0F4FA" font-size="68" font-weight="650" letter-spacing="-.9">Welcome</text><g class="hand-enter"><text class="wave" x="640" y="90" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="62">👋</text></g><text class="welcome-subtitle" x="480" y="134" fill="#D6DDEC" font-size="21" font-weight="600" letter-spacing=".6">To my GitHub profile</text></g></g></svg>
