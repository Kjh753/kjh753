<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176" role="img" aria-label="Welcome — To my GitHub profile"><style>
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{transform:translateX(-35px);opacity:.65}50%{transform:translateX(35px);opacity:1}}
@keyframes line{from{stroke-dashoffset:240;opacity:0}to{stroke-dashoffset:0;opacity:.65}}
text:first-child{animation:arrive 1.1s ease-out both}
text:last-child{animation:arrive 1s .35s ease-out both}
ellipse{animation:glow 8s ease-in-out infinite}
ellipse:nth-of-type(2){animation-delay:-4s}
path{stroke-dasharray:240;animation:line 1.3s .55s ease-out both}
@keyframes wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(18deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(16deg)}80%{transform:rotate(-5deg)}}
.hand-enter{animation:arrive 1s .35s ease-out both}
text.wave{transform-box:fill-box;transform-origin:60% 85%;animation:wave 1.2s 1.1s 2 ease-in-out both}
@media(prefers-reduced-motion:reduce){text,ellipse,path,.hand-enter{animation:none!important}}
</style><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5D8CFF" /><stop offset="1" stop-color="#AD83F7" /></linearGradient><radialGradient id="blue"><stop stop-color="#3B6DF1" stop-opacity=".25" /><stop offset="1" stop-color="#3B6DF1" stop-opacity="0" /></radialGradient><radialGradient id="purple"><stop stop-color="#9263D9" stop-opacity=".24" /><stop offset="1" stop-color="#9263D9" stop-opacity="0" /></radialGradient><clipPath id="banner-clip"><rect width="960" height="176" rx="15" /></clipPath></defs><g clip-path="url(#banner-clip)"><rect width="960" height="176" rx="15" fill="#101722" /><ellipse cx="290" cy="50" rx="330" ry="180" fill="url(#blue)" /><ellipse cx="750" cy="140" rx="350" ry="190" fill="url(#purple)" /><rect x=".5" y=".5" width="959" height="175" rx="15" fill="none" stroke="#2C374E" /><path d="M370 153H590" stroke="url(#accent)" stroke-width="1.5" opacity=".65" /><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="456" y="94" fill="#F0F4FA" font-size="58" font-weight="650" letter-spacing="-.9">Welcome</text><g class="hand-enter"><text class="wave" x="618" y="90" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="40">👋</text></g><text x="480" y="128" fill="#AAB6CA" font-size="17" letter-spacing=".6">To my GitHub profile</text></g></g></svg>