<svg xmlns="http://www.w3.org/2000/svg" width="360" height="445" viewBox="0 0 360 445" role="img" aria-labelledby="title desc"><title id="title">On- &amp; Off-Campus Activities</title><desc id="desc">2026 09.04 – 09.06: 국제로봇올림피아드(IRO) 운영요원. KAIST. 참가자 안내, 경기 진행 보조 및 현장 운영 지원 / 2026 08.31: 공공데이터 활용 공모전. 국립한밭대학교. 대덕특구 공공기술의 사업화를 위한 기술 탐색 및 청년 창업 아이디어 추천 플랫폼 기획</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif"><path d="M9 68V246" fill="none" stroke="#343C49" stroke-width="2"/><path d="M9 246V428" fill="none" stroke="#343C49" stroke-width="2"/><circle cx="9" cy="68" r="6" fill="#B29AF8"/><circle cx="9" cy="246" r="6" fill="#B29AF8"/><text x="0" y="32" font-size="23" fill="#E6EDF3" font-weight="600">2026</text><text x="30" y="74" font-size="15" fill="#A6B0BD" font-weight="600">09.04 – 09.06</text><text x="30" y="105" font-size="17" fill="#E6EDF3" font-weight="600">국제로봇올림피아드(IRO) 운영요원</text><text x="30" y="137" font-size="15" fill="#A6B0BD" font-weight="400">KAIST</text><text x="30" y="164" font-size="16" fill="#A6B0BD" font-weight="400">참가자 안내, 경기 진행 보조 및 현장 운영</text><text x="30" y="191" font-size="16" fill="#A6B0BD" font-weight="400">지원</text><text x="30" y="252" font-size="15" fill="#A6B0BD" font-weight="600">08.31</text><text x="30" y="283" font-size="17" fill="#E6EDF3" font-weight="600">공공데이터 활용 공모전</text><text x="30" y="315" font-size="15" fill="#A6B0BD" font-weight="400">국립한밭대학교</text><text x="30" y="342" font-size="16" fill="#A6B0BD" font-weight="400">대덕특구 공공기술의 사업화를 위한 기술</text><text x="30" y="369" font-size="16" fill="#A6B0BD" font-weight="400">탐색 및 청년 창업 아이디어 추천 플랫폼</text><text x="30" y="396" font-size="16" fill="#A6B0BD" font-weight="400">기획</text></g></svg>
