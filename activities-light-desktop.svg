<svg xmlns="http://www.w3.org/2000/svg" width="840" height="302" viewBox="0 0 840 302" role="img" aria-labelledby="title desc"><title id="title">On- &amp; Off-Campus Activities</title><desc id="desc">2026 09.04 – 09.06: 국제로봇올림피아드(IRO) 운영요원. KAIST. 참가자 안내, 경기 진행 보조 및 현장 운영 지원 / 2026 08.31: 공공데이터 활용 공모전. 국립한밭대학교. 대덕특구 공공기술의 사업화를 위한 기술 탐색 및 청년 창업 아이디어 추천 플랫폼 기획</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif"><path d="M128 68V188" fill="none" stroke="#D1D9E0" stroke-width="2"/><path d="M128 188V285" fill="none" stroke="#D1D9E0" stroke-width="2"/><circle cx="128" cy="68" r="6" fill="#7353BA"/><circle cx="128" cy="188" r="6" fill="#7353BA"/><text x="0" y="32" font-size="23" fill="#1F2328" font-weight="600">2026</text><text x="104" y="74" font-size="16" fill="#1F2328" font-weight="600" text-anchor="end">09.04</text><text x="104" y="100" font-size="14" fill="#59636E" font-weight="400" text-anchor="end">– 09.06</text><text x="154" y="74" font-size="17" fill="#1F2328" font-weight="600">국제로봇올림피아드(IRO) 운영요원</text><text x="154" y="106" font-size="15" fill="#59636E" font-weight="400">KAIST</text><text x="154" y="133" font-size="16" fill="#59636E" font-weight="400">참가자 안내, 경기 진행 보조 및 현장 운영 지원</text><text x="104" y="194" font-size="16" fill="#1F2328" font-weight="600" text-anchor="end">08.31</text><text x="154" y="194" font-size="17" fill="#1F2328" font-weight="600">공공데이터 활용 공모전</text><text x="154" y="226" font-size="15" fill="#59636E" font-weight="400">국립한밭대학교</text><text x="154" y="253" font-size="16" fill="#59636E" font-weight="400">대덕특구 공공기술의 사업화를 위한 기술 탐색 및 청년 창업 아이디어 추천 플랫폼 기획</text></g></svg>
